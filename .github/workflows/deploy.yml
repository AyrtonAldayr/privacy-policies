name: Deploy Privacy Policies to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Generate Execution Summary Report
        if: always()
        run: |
          {
            echo "## 🛡️ Reporte de Despliegue — Centro de Políticas de Privacidad"
            echo ""
            echo "| Parámetro | Valor |"
            echo "| :--- | :--- |"
            echo "| **Repositorio** | \`${GITHUB_REPOSITORY}\` |"
            echo "| **Rama** | \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA::7}\`) |"
            echo "| **Estado del Despliegue** | ✅ Publicado con éxito |"
            echo "| **URL Pública** | [Ver Sitio en GitHub Pages](https://ayrtonaldayr.github.io/privacy-policies/tusplanes/) |"
            echo ""
            echo "### 📱 Aplicaciones Publicadas"
            echo ""
            echo "| Aplicación | Paquete Android | URL Directa de Política de Privacidad | Estado |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| **TusPlanes** | \`pe.tusplanes.mobile\` | [Ver Política TusPlanes](https://ayrtonaldayr.github.io/privacy-policies/tusplanes/) | ✅ Directo / Google Play Compliant |"
            echo "| **Centro Hub** | Multi-Proyecto | [Ver Centro de Políticas](https://ayrtonaldayr.github.io/privacy-policies/) | ✅ Activo |"
          } >> "$GITHUB_STEP_SUMMARY"

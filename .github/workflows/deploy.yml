name: Deploy Privacy Policies Hub & Report

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy-and-report:
    name: Deploy to gh-pages & Generate Report
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Deploy to GitHub Pages Branch (gh-pages)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B gh-pages
          git push -f origin gh-pages

      - name: Generate Job Execution Summary Report
        if: always()
        run: |
          {
            echo "## 🛡️ Reporte de Despliegue — Centro de Políticas de Privacidad"
            echo ""
            echo "| Parámetro | Valor |"
            echo "| :--- | :--- |"
            echo "| **Repositorio** | \`${GITHUB_REPOSITORY}\` |"
            echo "| **Rama Despliegue** | \`gh-pages\` |"
            echo "| **Estado del Sitio** | ✅ Publicado |"
            echo "| **URL Pública** | [Ver Sitio en GitHub Pages](https://ayrtonaldayr.github.io/privacy-policies/tusplanes/) |"
            echo ""
            echo "### 📱 Aplicaciones Publicadas"
            echo ""
            echo "| Aplicación | Paquete Android | URL Directa de Política de Privacidad | Estado |"
            echo "| :--- | :--- | :--- | :--- |"
            echo "| **TusPlanes** | \`pe.tusplanes.mobile\` | [Ver Política TusPlanes](https://ayrtonaldayr.github.io/privacy-policies/tusplanes/) | ✅ Directo / Google Play Compliant |"
            echo "| **Centro Hub** | Multi-Proyecto | [Ver Centro de Políticas](https://ayrtonaldayr.github.io/privacy-policies/) | ✅ Activo |"
          } >> "$GITHUB_STEP_SUMMARY"
